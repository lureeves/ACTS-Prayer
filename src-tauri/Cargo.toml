[package]
name = "acts-prayer-app"
version = "1.0.0"
description = "ACTS Method Guided Desktop Prayer App"
authors = ["Lukas Reeves"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
